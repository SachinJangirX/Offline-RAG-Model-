<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline RAG Assistant</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div class="app">
        <header class="topbar">
            <div class="header-left">
                <div class="logo-section">
                    <img src="/static/logo.png" alt="Defence R&D Organization" class="logo-image">
                    <div>
                        <div class="logo-title">Offline RAG Assistant</div>
                        <div class="logo-subtitle">LOCAL AI AGENT (ADB)</div>
                    </div>
                </div>
            </div>
            <div class="badge">Local Mode</div>
        </header>

        <div class="main">
            <aside class="sidebar">
                <div class="sidebar-section">
                    <h3>Upload Documents</h3>
                    <input type="file" id="fileInput" multiple />
                    <button id="uploadBtn" class="primary-btn" onclick="uploadFile()">Upload PDF</button>
                </div>

                <div class="sidebar-section">
                    <h3>Delete Documents</h3>
                    <input type="text" id="deleteFileName" placeholder="Click a file below to select ..." />
                    <button id="deleteBtn" class="danger-btn">Delete</button>
                </div>

                <div class="sidebar-section">
                    <h3>Uploaded Files</h3>
                    <label class="select-all-label">
                        <input type="checkbox" id="selectAllFiles" onchange="toggleSelectAll(this)" />
                        Select All
                    </label>
                    <div id="fileList" class="file-display">
                        Loading...
                    </div>
                    <button id="rebuildBtn" class="rebuild-btn" onclick="rebuildIndex()" style="margin-top:10px;">
                        Rebuild Index
                    </button>
                </div>
            </aside>

            <section class="chat-section">
                <div id="chat" class="chat-box"></div>

                <div class="input-area">
                    <input
                        type="text"
                        id="question"
                        placeholder="Ask a question  —or—  select files in the sidebar and click Generate Report"
                        onkeydown="if(event.key==='Enter') sendQuestion()"
                    />
                    <button id="sendBtn" class="send-btn" onclick="sendQuestion()">Send</button>
                    <button id="generateReportBtn" class="report-btn" onclick="generateReport()">Generate Report</button>
                    <button id="comparativeReportBtn" class="comparative-btn" onclick="openComparativeModal()" style="display:none;">
                        Compare Files
                    </button>
                </div>
            </section>
        </div>
    </div>

    <div id="comparativeModal" class="modal" style="display:none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Generate Comparative Report</h2>
                <button class="modal-close" onclick="closeComparativeModal()">&times;</button>
            </div>
            <div class="modal-body">
                <label for="comparativeQuery">Comparison Query:</label>
                <textarea
                    id="comparativeQuery"
                    class="comparison-textarea"
                    placeholder="Enter your comparison question&#10;Example: Compare power consumption and efficiency specifications"
                    rows="4"
                ></textarea>
                <p class="modal-hint" id="comparativeFilesList"></p>
            </div>
            <div class="modal-footer">
                <button class="cancel-btn" onclick="closeComparativeModal()">Cancel</button>
                <button class="confirm-btn" onclick="submitComparativeReport()">Generate Comparison</button>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
